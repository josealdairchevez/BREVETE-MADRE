<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Brevete - ¡Tú puedes Mamá!</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Google Fonts: Quicksand -->
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a18cd1 100%);
      background-attachment: fixed;
      min-height: 100vh;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.2);
    }

    .option-btn {
      transition: all 0.2s ease;
    }

    .option-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .signal-box, .icon-3d {
      filter: drop-shadow(0 12px 16px rgba(15, 23, 42, 0.25));
    }

    /* Estilo del Diccionario Interactivo (Palabras Celestes) */
    .termino-tecnico {
      color: #0284c7;
      text-decoration: underline;
      text-decoration-style: dotted;
      cursor: pointer;
      font-weight: 800;
      transition: color 0.2s ease;
    }

    .termino-tecnico:hover, .termino-tecnico:active {
      color: #2563eb;
    }

    /* Estilos del Gráfico Circular */
    .circular-chart {
      display: block;
      margin: 0 auto;
      max-width: 100%;
      max-height: 100%;
    }
    .circle-bg {
      fill: none;
      stroke: #f1f5f9;
      stroke-width: 3.8;
    }
    .circle {
      fill: none;
      stroke-width: 3.5;
      stroke-linecap: round;
      animation: progress 1.5s ease-out forwards;
    }
    @keyframes progress {
      0% { stroke-dasharray: 0 100; }
    }
    .percentage {
      fill: #334155;
      font-family: 'Quicksand', sans-serif;
      font-weight: 800;
      font-size: 0.6em;
      text-anchor: middle;
    }
  </style>
</head>
<body class="flex items-start justify-center p-3 sm:p-6 text-slate-800">

  <!-- DEFS GLOBALES PARA LOS SVG 3D (reutilizados por todos los íconos) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="gradRed3d" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fca5a5"/>
        <stop offset="55%" stop-color="#ef4444"/>
        <stop offset="100%" stop-color="#b91c1c"/>
      </linearGradient>
      <radialGradient id="gradWhite3d" cx="35%" cy="25%" r="85%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#dbe3ef"/>
      </radialGradient>
      <linearGradient id="gradSteel3d" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#64748b"/>
        <stop offset="100%" stop-color="#1e293b"/>
      </linearGradient>
      <linearGradient id="gradAsphalt3d" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#475569"/>
        <stop offset="100%" stop-color="#1e293b"/>
      </linearGradient>
      <linearGradient id="gradGreen3d" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#6ee7b7"/>
        <stop offset="100%" stop-color="#059669"/>
      </linearGradient>
      <linearGradient id="gradAmber3d" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fde68a"/>
        <stop offset="100%" stop-color="#d97706"/>
      </linearGradient>
      <linearGradient id="gradBlue3d" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#93c5fd"/>
        <stop offset="100%" stop-color="#1d4ed8"/>
      </linearGradient>
      <linearGradient id="gradYellowCar3d" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fde047"/>
        <stop offset="100%" stop-color="#ca8a04"/>
      </linearGradient>
      <linearGradient id="gradPurpleCar3d" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#c4b5fd"/>
        <stop offset="100%" stop-color="#6d28d9"/>
      </linearGradient>
      <linearGradient id="gradCardPink" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fff1f4"/>
        <stop offset="100%" stop-color="#f3e8ff"/>
      </linearGradient>
      <linearGradient id="gradCardSky" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f0f9ff"/>
        <stop offset="100%" stop-color="#e0f2fe"/>
      </linearGradient>
    </defs>
  </svg>

  <main class="w-full max-w-2xl glass-card rounded-3xl p-4 sm:p-7 mt-2 mb-6 relative">

    <!-- ENCABEZADO -->
    <header id="quiz-header" class="mb-3 relative">
      <button onclick="activarModoAleatorio()" type="button" aria-label="Mezclar preguntas" class="absolute top-0 right-0 w-11 h-11 sm:w-12 sm:h-12 flex items-center justify-center bg-indigo-500 text-white rounded-full shadow-md active:scale-95 hover:bg-indigo-600 transition-all text-xl z-10">
        🔀
      </button>
      <h1 class="text-lg sm:text-2xl font-extrabold text-rose-500 uppercase text-center sm:text-left tracking-wide pr-12 sm:pr-14 mb-2">
        🚗 ¡A POR TU BREVETE MAMÁ!
      </h1>

      <div class="flex text-sm sm:text-base justify-between items-center bg-white/80 px-3 py-1.5 rounded-xl shadow-sm border border-rose-50 mb-2 font-bold">
        <span class="text-emerald-500">✔ Bien: <span id="correct-count">0</span></span>
        <span class="text-slate-300">|</span>
        <span class="text-rose-400">✖ Mal: <span id="incorrect-count">0</span></span>
        <span class="text-indigo-500 ml-auto" id="question-index-text">1 de 20</span>
      </div>

      <div class="w-full bg-rose-100 h-2 rounded-full overflow-hidden">
        <div id="progress-bar" class="h-full bg-gradient-to-r from-rose-400 to-purple-500 rounded-full transition-all duration-500 w-0"></div>
      </div>
    </header>

    <!-- ZONA CENTRAL DE PREGUNTAS -->
    <section id="quiz-container">

      <div id="image-container" class="hidden flex justify-center items-center mb-2 max-h-24 sm:max-h-32 overflow-hidden"></div>

      <h2 id="question-text" class="text-xl sm:text-2xl font-extrabold text-slate-800 leading-snug mb-3 text-center sm:text-left">
        Cargando pregunta...
      </h2>

      <div id="options-container" class="space-y-2 mb-3"></div>

      <!-- Feedback -->
      <div id="feedback-box" class="hidden p-4 sm:p-5 rounded-2xl shadow-md border-2 flex flex-col gap-3 mt-3 transition-all">

        <div>
          <div class="flex items-center justify-between mb-2">
             <div class="flex items-center gap-2 font-bold text-lg sm:text-xl" id="feedback-title"></div>
             <button id="change-explanation-btn" type="button" class="hidden bg-white/50 hover:bg-white text-indigo-700 font-bold py-1.5 px-3 rounded-lg border border-indigo-200 text-xs sm:text-sm shadow-sm transition-colors">
                Otra forma 🔄
             </button>
          </div>
          <p id="feedback-explanation" class="text-base sm:text-lg leading-relaxed text-slate-700 font-medium"></p>
          <div id="explanation-counter" class="text-xs text-slate-500 font-bold mt-1 text-right hidden">1 de 3</div>
        </div>

        <div class="flex flex-col sm:flex-row gap-3 mt-2">
           <button id="finish-early-btn" type="button" onclick="showResults()" class="py-3 px-4 bg-slate-200 text-slate-700 text-sm font-bold rounded-xl shadow active:scale-95 transition-transform">
             Finalizar Ahora
           </button>
           <button id="next-btn" type="button" class="flex-1 w-full py-3.5 bg-gradient-to-r from-rose-500 to-purple-500 text-white text-base sm:text-lg font-bold rounded-xl shadow-lg active:scale-95 transition-transform">
             Siguiente Pregunta ➔
           </button>
        </div>
      </div>
    </section>

    <!-- PANTALLA FINAL (DIAGNÓSTICO) -->
    <section id="results-container" class="hidden flex-col items-center justify-center text-center py-6">
      <h2 class="text-3xl font-extrabold text-rose-500 mb-2" id="result-main-title">¡Misión Cumplida, Mamá! 🎉</h2>
      <p class="text-slate-500 text-sm sm:text-base mb-6 font-bold">Tu diagnóstico de hoy:</p>

      <div class="flex flex-col sm:flex-row w-full items-center justify-center gap-6 mb-6">
        <div class="relative w-36 h-36 shrink-0">
          <svg viewBox="0 0 36 36" class="circular-chart">
            <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
            <path class="circle" id="donut-chart" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
            <text x="18" y="20.5" class="percentage" id="donut-percentage">0%</text>
          </svg>
        </div>
        <div class="flex flex-col gap-3 w-full max-w-xs">
          <div class="bg-emerald-50 border border-emerald-200 rounded-xl px-4 py-3 flex items-center justify-between shadow-sm">
            <div class="text-emerald-700 text-xs font-bold uppercase">Respuestas Correctas</div>
            <div class="text-emerald-600 text-2xl font-black" id="final-correct">0</div>
          </div>
          <div class="bg-rose-50 border border-rose-200 rounded-xl px-4 py-3 flex items-center justify-between shadow-sm">
            <div class="text-rose-700 text-xs font-bold uppercase">Preguntas a Repasar</div>
            <div class="text-rose-600 text-2xl font-black" id="final-incorrect">0</div>
          </div>
        </div>
      </div>

      <div class="w-full bg-white border border-slate-200 rounded-xl p-4 shadow-sm mb-6 text-left" id="diagnostic-box">
        <div class="flex items-center gap-2 mb-2">
          <span class="text-2xl" id="diagnostic-icon">💡</span>
          <h3 class="font-bold text-base text-slate-800" id="diagnostic-title">Mi recomendación:</h3>
        </div>
        <p class="text-slate-600 text-sm leading-relaxed" id="diagnostic-text"></p>
      </div>

      <div class="flex flex-col sm:flex-row gap-3 w-full max-w-md">
        <button onclick="restartQuiz(false)" type="button" class="flex-1 py-3.5 bg-white border-2 border-emerald-400 text-emerald-500 text-sm font-bold rounded-xl shadow-sm hover:bg-emerald-50 transition-colors">
          Repetir Orden
        </button>
        <button onclick="activarModoAleatorio()" type="button" class="flex-1 py-3.5 bg-gradient-to-r from-indigo-500 to-purple-600 text-white text-sm font-bold rounded-xl shadow-md hover:shadow-lg transition-all">
          Nuevo Mezclado 🔀
        </button>
      </div>
    </section>

  </main>

  <script>
    // =============================================================
    // FÁBRICA DE ÍCONOS SVG "PREMIUM 3D" (reemplaza los emoticones)
    // =============================================================
    function brilloElipse(cx, cy, rx, ry) {
      return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#ffffff" opacity="0.35"/>`;
    }
    function sombraSuelo(cx, cy, rx, ry) {
      return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#0f172a" opacity="0.18"/>`;
    }

    // --- Íconos interiores (pictogramas negros) para señales circulares ---
    const iconoFlechaCurvaIzq = `<path d="M 60 68 L 60 40 Q 60 30 50 30 L 30 30 M 40 20 L 30 30 L 40 40" stroke="#1e293b" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
    const iconoFlechaArriba = `<path d="M 50 75 L 50 27 M 35 42 L 50 27 L 65 42" stroke="#1e293b" stroke-width="10" fill="none" stroke-linejoin="round" stroke-linecap="round"/>`;
    const iconoMallaCoche = `<path d="M 22 34 L 78 34 M 22 50 L 78 50 M 22 66 L 78 66 M 34 22 L 34 78 M 50 22 L 50 78 M 66 22 L 66 78" stroke="#cbd5e1" stroke-width="2"/><rect x="28" y="40" width="44" height="24" rx="5" fill="#1e293b"/><circle cx="36" cy="64" r="5" fill="#475569"/><circle cx="64" cy="64" r="5" fill="#475569"/>`;
    const iconoBocina = `<path d="M 60 38 L 76 27 L 76 73 L 60 62 L 33 62 L 33 38 Z" fill="#1e293b"/><path d="M 82 35 Q 90 50 82 65" stroke="#1e293b" stroke-width="5" fill="none" stroke-linecap="round"/>`;

    // Señal circular reglamentaria en 3D (prohibición o mandato), sobre tarjeta con sombra
    function senalCircular3D(iconoInterior, prohibido) {
      return `<svg viewBox="0 0 120 120" class="w-20 h-20 sm:w-24 sm:h-24 icon-3d">
        <rect x="3" y="3" width="114" height="114" rx="24" fill="url(#gradCardPink)"/>
        ${sombraSuelo(60,104,34,6)}
        <circle cx="60" cy="60" r="46" fill="url(#gradRed3d)"/>
        <circle cx="60" cy="60" r="37" fill="url(#gradWhite3d)"/>
        ${brilloElipse(46,36,20,10)}
        <g transform="translate(10,10)">${iconoInterior}</g>
        ${prohibido ? '<line x1="33" y1="31" x2="87" y2="89" stroke="#dc2626" stroke-width="9" stroke-linecap="round"/>' : ''}
      </svg>`;
    }

    // Señal "Prohibido estacionar" (disco azul, aro rojo, letra P), sobre tarjeta con sombra
    function senalNoEstacionar3D() {
      return `<svg viewBox="0 0 120 120" class="w-20 h-20 sm:w-24 sm:h-24 icon-3d">
        <rect x="3" y="3" width="114" height="114" rx="24" fill="url(#gradCardPink)"/>
        ${sombraSuelo(60,104,34,6)}
        <circle cx="60" cy="60" r="46" fill="url(#gradRed3d)"/>
        <circle cx="60" cy="60" r="37" fill="url(#gradBlue3d)"/>
        ${brilloElipse(46,38,20,10)}
        <text x="60" y="74" font-family="Quicksand" font-weight="800" font-size="42" fill="#fff" text-anchor="middle">P</text>
        <line x1="33" y1="31" x2="87" y2="89" stroke="#dc2626" stroke-width="9" stroke-linecap="round"/>
      </svg>`;
    }

    // Semáforo 3D configurable (color activo, todos encendidos, flecha lateral, parpadeo), sobre tarjeta con sombra
    function semaforo3D({activo=null, todos=false, flecha=null, parpadea=false} = {}) {
      const rojoOn = todos || activo === 'rojo';
      const ambarOn = todos || activo === 'ambar';
      const verdeOn = todos || activo === 'verde';
      const op = (on) => on ? 1 : 0.16;
      const brillo = (on, cy) => on ? brilloElipse(56, cy-6, 8, 4) : '';
      const gradFlecha = flecha === 'roja' ? 'url(#gradRed3d)' : 'url(#gradGreen3d)';
      return `<svg viewBox="0 0 140 200" class="w-16 h-28 sm:w-20 sm:h-32 icon-3d">
        <rect x="3" y="3" width="134" height="194" rx="26" fill="url(#gradCardSky)"/>
        ${sombraSuelo(65,182,30,6)}
        <rect x="25" y="15" width="70" height="130" rx="18" fill="url(#gradSteel3d)"/>
        <rect x="25" y="15" width="70" height="18" rx="18" fill="#fff" opacity="0.12"/>
        <rect x="31" y="21" width="58" height="118" rx="14" fill="#0f172a"/>
        <circle cx="60" cy="48" r="19" fill="url(#gradRed3d)" opacity="${op(rojoOn)}"/>
        ${brillo(rojoOn, 48)}
        <circle cx="60" cy="80" r="19" fill="url(#gradAmber3d)" opacity="${op(ambarOn)}"/>
        ${brillo(ambarOn, 80)}
        <circle cx="60" cy="112" r="19" fill="url(#gradGreen3d)" opacity="${op(verdeOn)}"/>
        ${brillo(verdeOn, 112)}
        <rect x="52" y="145" width="16" height="20" fill="url(#gradSteel3d)"/>
        <rect x="28" y="163" width="64" height="10" rx="4" fill="url(#gradSteel3d)"/>
        ${flecha ? `<rect x="100" y="68" width="28" height="28" rx="7" fill="url(#gradSteel3d)"/>
          <circle cx="114" cy="82" r="10" fill="${gradFlecha}"/>
          <path d="${flecha === 'roja' ? 'M 120 82 L 108 82 M 108 82 L 114 76 M 108 82 L 114 88' : 'M 108 82 L 120 82 M 120 82 L 114 76 M 120 82 L 114 88'}" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
        ${parpadea ? '<circle cx="106" cy="28" r="7" fill="#fde68a"><animate attributeName="opacity" values="1;0.15;1" dur="0.9s" repeatCount="indefinite"/></circle>' : ''}
      </svg>`;
    }

    // Escena: paradero autorizado con bus y persona esperando (tarjeta + sombras + brillos)
    function escenaParadero3D() {
      return `<svg viewBox="0 0 220 160" class="w-36 sm:w-44 icon-3d">
        <rect x="3" y="3" width="214" height="154" rx="26" fill="url(#gradCardSky)"/>
        <rect x="14" y="108" width="192" height="38" rx="10" fill="url(#gradAsphalt3d)"/>
        <rect x="14" y="108" width="192" height="9" rx="4" fill="#94a3b8" opacity="0.55"/>
        ${sombraSuelo(150,150,58,7)}
        ${sombraSuelo(58,150,16,5)}
        <rect x="34" y="55" width="10" height="60" rx="4" fill="url(#gradSteel3d)"/>
        <rect x="16" y="34" width="80" height="26" rx="10" fill="url(#gradBlue3d)"/>
        ${brilloElipse(35,42,18,6)}
        <text x="56" y="52" font-family="Quicksand" font-weight="800" font-size="12" fill="#fff" text-anchor="middle">PARADERO</text>
        <rect x="95" y="62" width="118" height="52" rx="18" fill="url(#gradYellowCar3d)"/>
        <rect x="95" y="62" width="118" height="16" rx="18" fill="#fff" opacity="0.25"/>
        <rect x="106" y="72" width="26" height="20" rx="6" fill="url(#gradBlue3d)"/>
        <rect x="138" y="72" width="26" height="20" rx="6" fill="url(#gradBlue3d)"/>
        <rect x="170" y="72" width="26" height="20" rx="6" fill="url(#gradBlue3d)"/>
        ${brilloElipse(114,78,9,4)}${brilloElipse(146,78,9,4)}${brilloElipse(178,78,9,4)}
        <circle cx="120" cy="116" r="12" fill="url(#gradSteel3d)"/>
        <circle cx="120" cy="116" r="5" fill="#0f172a"/>
        <circle cx="190" cy="116" r="12" fill="url(#gradSteel3d)"/>
        <circle cx="190" cy="116" r="5" fill="#0f172a"/>
        <circle cx="60" cy="88" r="11" fill="#fbbf24"/>
        ${brilloElipse(57,84,4,3)}
        <path d="M 48 100 Q 60 92 72 100 L 72 128 Q 60 134 48 128 Z" fill="url(#gradPurpleCar3d)"/>
      </svg>`;
    }

    // Escena: dos autos en pista, adelantamiento / cortesía al ser sobrepasada
    function escenaAdelantamiento3D(cortesia) {
      const x2 = cortesia ? 150 : 118;
      const y2 = 96;
      return `<svg viewBox="0 0 220 150" class="w-36 sm:w-44 icon-3d">
        <rect x="3" y="3" width="214" height="144" rx="26" fill="url(#gradCardSky)"/>
        <rect x="14" y="18" width="192" height="114" rx="16" fill="url(#gradAsphalt3d)"/>
        <line x1="14" y1="75" x2="206" y2="75" stroke="#facc15" stroke-width="5" stroke-dasharray="16 12" stroke-linecap="round"/>
        <line x1="14" y1="30" x2="206" y2="30" stroke="#f8fafc" stroke-width="3" opacity="0.55"/>
        <line x1="14" y1="120" x2="206" y2="120" stroke="#f8fafc" stroke-width="3" opacity="0.55"/>
        ${sombraSuelo(57,72,32,6)}
        <rect x="28" y="42" width="58" height="30" rx="14" fill="url(#gradPurpleCar3d)"/>
        <rect x="28" y="42" width="58" height="11" rx="11" fill="#fff" opacity="0.25"/>
        <rect x="38" y="49" width="18" height="14" rx="4" fill="#e0f2fe" opacity="0.9"/>
        ${sombraSuelo(x2+29,y2+32,32,6)}
        <rect x="${x2}" y="${y2}" width="58" height="30" rx="14" fill="url(#gradYellowCar3d)"/>
        <rect x="${x2}" y="${y2}" width="58" height="11" rx="11" fill="#fff" opacity="0.25"/>
        <rect x="${x2+10}" y="${y2+7}" width="18" height="14" rx="4" fill="#e0f2fe" opacity="0.9"/>
      </svg>`;
    }

    // Escena: avenida girando a la izquierda con direccional parpadeando
    function escenaGiroIzquierda3D() {
      return `<svg viewBox="0 0 220 170" class="w-36 sm:w-44 icon-3d">
        <rect x="3" y="3" width="214" height="164" rx="26" fill="url(#gradCardPink)"/>
        <rect x="14" y="14" width="192" height="142" rx="18" fill="url(#gradAsphalt3d)"/>
        <path d="M 195 45 L 95 45 Q 45 45 45 95 L 45 156" stroke="#f8fafc" stroke-width="4" stroke-dasharray="14 10" fill="none" opacity="0.65"/>
        ${sombraSuelo(150,72,30,6)}
        <g transform="rotate(-28 150 68)">
          <rect x="121" y="53" width="58" height="30" rx="14" fill="url(#gradPurpleCar3d)"/>
          <rect x="121" y="53" width="58" height="11" rx="11" fill="#fff" opacity="0.25"/>
        </g>
        <circle cx="185" cy="55" r="7" fill="#fde68a">
          <animate attributeName="opacity" values="1;0.15;1" dur="0.8s" repeatCount="indefinite"/>
        </circle>
      </svg>`;
    }

    // Escena: pista con varios carriles y auto cambiando de carril con direccional
    function escenaCarril3D() {
      return `<svg viewBox="0 0 220 150" class="w-36 sm:w-44 icon-3d">
        <rect x="3" y="3" width="214" height="144" rx="26" fill="url(#gradCardPink)"/>
        <rect x="14" y="18" width="192" height="114" rx="16" fill="url(#gradAsphalt3d)"/>
        <line x1="14" y1="50" x2="206" y2="50" stroke="#f8fafc" stroke-width="3" stroke-dasharray="14 10" opacity="0.65"/>
        <line x1="14" y1="100" x2="206" y2="100" stroke="#f8fafc" stroke-width="3" stroke-dasharray="14 10" opacity="0.65"/>
        ${sombraSuelo(121,93,32,6)}
        <rect x="92" y="60" width="58" height="30" rx="14" fill="url(#gradPurpleCar3d)"/>

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

      Swal.fire({
        title: '¡Modo Simulacro! 🔀',

      });

    function loadQuestion() {
      hasAnswered = false;
      feedbackBox.classList.add("hidden");
      currentExplanationIndex = 0;

      const currentQ = currentQuestions[currentIndex];
      const prefijo = modoAleatorio ? `(${currentQ.id}) ` : "";

      let textoPreguntaTratado = currentQ.question.replace(/^\d+\.\s*/, '');
      textoPreguntaTratado = resaltarTexto(textoPreguntaTratado);
      questionText.innerHTML = prefijo + textoPreguntaTratado;

      if (currentQ.imageHtml) {
        imageContainer.innerHTML = currentQ.imageHtml;
        imageContainer.classList.remove("hidden");
      } else {
        imageContainer.innerHTML = "";
        imageContainer.classList.add("hidden");
      }

      questionIndexText.textContent = `${currentIndex + 1} de ${currentQuestions.length}`;
      progressBar.style.width = `${(currentIndex / currentQuestions.length) * 100}%`;

      optionsContainer.innerHTML = "";
      currentQ.options.forEach((option, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option-btn w-full p-3 sm:p-4 text-left font-bold text-slate-700 bg-white border-2 border-transparent hover:border-rose-300 rounded-2xl flex items-start gap-3 text-lg sm:text-xl shadow-sm";
        btn.innerHTML = `<span class="flex-1 leading-snug">${resaltarTexto(option)}</span>`;

        btn.addEventListener('click', function(e) {
           e.preventDefault();
           selectOption(idx);
        });

        optionsContainer.appendChild(btn);
      });

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderExplanation() {
      const currentQ = currentQuestions[currentIndex];
      feedbackExplanation.innerHTML = resaltarTexto(currentQ.explanations[currentExplanationIndex]);

      if (currentQ.explanations.length > 1) {
          changeExplanationBtn.classList.remove("hidden");
          explanationCounter.classList.remove("hidden");
          explanationCounter.textContent = `Explicación ${currentExplanationIndex + 1} de ${currentQ.explanations.length}`;
      } else {
          changeExplanationBtn.classList.add("hidden");
          explanationCounter.classList.add("hidden");
      }
    }

    changeExplanationBtn.addEventListener('click', function(e) {
      e.preventDefault();
      const currentQ = currentQuestions[currentIndex];
      currentExplanationIndex++;
      if (currentExplanationIndex >= currentQ.explanations.length) {
          currentExplanationIndex = 0;
      }
      renderExplanation();

      hasAnswered = true;

      const currentQ = currentQuestions[currentIndex];
      const buttons = optionsContainer.querySelectorAll("button");
      const isCorrect = selectedIdx === currentQ.correct;

      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        btn.classList.remove("bg-white", "hover:border-rose-300");

        if (idx === currentQ.correct) {
          btn.classList.add("bg-emerald-100", "border-emerald-500", "text-emerald-950", "shadow-md");
        } else if (idx === selectedIdx) {
          btn.classList.add("bg-rose-100", "border-rose-400", "text-rose-900", "opacity-80");
        } else {
          btn.classList.add("bg-slate-50", "border-slate-200", "opacity-50");
        }
      });

      if (isCorrect) {
        correctCount++;
        correctCountElem.textContent = correctCount;
        triggerCelebration(40);
        feedbackTitle.innerHTML = `<span>✨</span> ¡Excelente respuesta, Mamá!`;
        feedbackBox.classList.remove("bg-amber-50", "border-amber-300");
        feedbackBox.classList.add("bg-emerald-50", "border-emerald-300");
      } else {
        incorrectCount++;
        incorrectCountElem.textContent = incorrectCount;

        if(currentQ.category) {
            erroresPorCategoria[currentQ.category] = (erroresPorCategoria[currentQ.category] || 0) + 1;
        }

        const frase = frasesAliento[Math.floor(Math.random() * frasesAliento.length)];
        feedbackTitle.innerHTML = `<span>💡</span> ${frase}`;
        feedbackBox.classList.remove("bg-emerald-50", "border-emerald-300");
        feedbackBox.classList.add("bg-amber-50", "border-amber-300");
      }

      renderExplanation();
      feedbackBox.classList.remove("hidden");

      if (currentIndex === currentQuestions.length - 1) {
          nextBtn.innerHTML = "Ver mis Resultados 🏆";
      } else {
          nextBtn.innerHTML = "Siguiente Pregunta ➔";
      }

      setTimeout(() => {
        feedbackBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 150);
    }

    function triggerCelebration(particles) {
      confetti({
        particleCount: particles,
        spread: 60,
        origin: { y: 0.8 },
        colors: ['#10b981', '#f43f5e', '#a855f7', '#fbbf24']
      });
    }

    nextBtn.addEventListener('click', function(e) {
      e.preventDefault();
      currentIndex++;
      if (currentIndex < currentQuestions.length) {
        loadQuestion();
      } else {
        showResults();
      }
    });

    finishEarlyBtn.addEventListener('click', function(e) {
      e.preventDefault();
      showResults();
    });

    function showResults() {
      header.classList.add("hidden");
      quizContainer.classList.add("hidden");

      resultsContainer.classList.remove("hidden");
      resultsContainer.classList.add("flex");

      const totalRespondidas = correctCount + incorrectCount;
      const porcentaje = totalRespondidas === 0 ? 0 : Math.round((correctCount / totalRespondidas) * 100);

      document.getElementById("final-correct").textContent = correctCount;
      document.getElementById("final-incorrect").textContent = incorrectCount;
      document.getElementById("donut-percentage").textContent = `${porcentaje}%`;

      const circle = document.getElementById("donut-chart");
      circle.style.strokeDasharray = `${porcentaje}, 100`;

      const diagnosticTitle = document.getElementById("diagnostic-title");
      const diagnosticText = document.getElementById("diagnostic-text");
      const diagnosticIcon = document.getElementById("diagnostic-icon");
      const diagnosticBox = document.getElementById("diagnostic-box");
      const mainTitle = document.getElementById("result-main-title");

      let peorTema = "";
      let maxErrores = 0;
      for (const [tema, errores] of Object.entries(erroresPorCategoria)) {
          if (errores > maxErrores) {
              maxErrores = errores;
              peorTema = tema;
          }
      }

      diagnosticBox.className = "w-full bg-white border-2 border-slate-200 rounded-2xl p-5 shadow-sm mb-6 text-left";

      if (totalRespondidas === 0) {
        circle.style.stroke = "#cbd5e1";
        mainTitle.textContent = "¡Ups!";
        diagnosticIcon.textContent = "🤔";
        diagnosticTitle.textContent = "Sin respuestas";
        diagnosticText.textContent = "Mamá, le diste a finalizar sin contestar. ¡Anímate a intentarlo!";
      } else if (porcentaje >= 85) {
        circle.style.stroke = "#10b981";
        mainTitle.textContent = "¡Triunfo total, Mamá! 🎉";
        diagnosticBox.classList.add("bg-emerald-50", "border-emerald-200");
        diagnosticTitle.classList.add("text-emerald-800");
        diagnosticIcon.textContent = "🌟";
        diagnosticTitle.textContent = "¡Estás lista para ese examen!";
        diagnosticText.textContent = "Dominas el balotario a la perfección. Hemos revisado tus respuestas y has entendido muy bien todas las reglas. ¡Ese brevete ya tiene tu nombre!";

        var duration = 3 * 1000;
        var end = Date.now() + duration;
        (function frame() {
          confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#10b981', '#fbbf24'] });
          confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#10b981', '#f43f5e'] });
          if (Date.now() < end) requestAnimationFrame(frame);
        }());

      } else if (porcentaje >= 65) {
        circle.style.stroke = "#f59e0b";
        mainTitle.textContent = "¡Vas súper bien! 👏";
        diagnosticBox.classList.add("bg-amber-50", "border-amber-200");
        diagnosticTitle.classList.add("text-amber-800");
        diagnosticIcon.textContent = "📈";
        diagnosticTitle.textContent = "Un consejo con cariño:";

        if(peorTema !== "") {
            diagnosticText.textContent = `Tienes una gran memoria. Sin embargo, vi que te confundiste un poquito en las preguntas sobre "${peorTema}". En el próximo intento, lee esas con un poquito más de calma. ¡Casi rozas la perfección!`;
        } else {
            diagnosticText.textContent = "Tienes una base muy sólida. Solo necesitas repasar los errores para asegurar la nota máxima.";
        }
      } else {
        circle.style.stroke = "#f43f5e";
        mainTitle.textContent = "¡A seguir practicando! 💪";
        diagnosticBox.classList.add("bg-rose-50", "border-rose-200");
        diagnosticTitle.classList.add("text-rose-800");
        diagnosticIcon.textContent = "❤️";
        diagnosticTitle.textContent = "El secreto es no rendirse:";

        if(peorTema !== "") {
             diagnosticText.textContent = `Mamita hermosa, hoy el tema de "${peorTema}" te dio batalla. ¡Pero para eso es este simulador! Usa el botón de 🔄 para leer otros ejemplos de explicación que te he puesto en cada pregunta, y toca las palabras celestes si hay algún término que no conozcas. ¡Yo creo en ti!`;
        } else {
             diagnosticText.textContent = "¡No te preocupes! Lee con calma las explicaciones e inténtalo otra vez. Cada intento te hace más experta.";
        }
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function restartQuiz(aleatorio = false) {
      modoAleatorio = aleatorio;
      currentQuestions = [...baseQuestions];
      if (modoAleatorio) shuffleArray(currentQuestions);

      currentIndex = 0; correctCount = 0; incorrectCount = 0;
      correctCountElem.textContent = "0"; incorrectCountElem.textContent = "0";

      for (let key in erroresPorCategoria) {
          erroresPorCategoria[key] = 0;
      }

      resultsContainer.classList.add("hidden");
      resultsContainer.classList.remove("flex");

      header.classList.remove("hidden");
      quizContainer.classList.remove("hidden");

      loadQuestion();
    }

    // Iniciar la app
    restartQuiz(false);
  </script>
</body>
</html>
